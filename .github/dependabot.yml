version: 2
updates:
  # Pinned image tags in each service's docker-compose.yml
  - package-ecosystem: "docker-compose"
    directories:
      - "/authelia"
      - "/caddy"
      - "/gitea"
      - "/headscale"
      - "/invidious"
      - "/libreddit"
      - "/nextcloud"
      - "/nitter"
      - "/pihole"
      - "/quetre"
      - "/rimgo"
      - "/syncthing"
      - "/tsidp"
      - "/vaultwarden"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore(deps)"
    open-pull-requests-limit: 10

  # Base images in custom Dockerfiles
  - package-ecosystem: "docker"
    directories:
      - "/caddy"
      - "/nextcloud"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore(deps)"

  # Actions used by the image build workflows
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore(ci)"
    groups:
      actions:
        patterns: ["*"]
